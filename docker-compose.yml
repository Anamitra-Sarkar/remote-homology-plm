name: remote-homology-plm

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "7860:7860"
    environment:
      MODEL_RELEASE_APPROVED: "false"
      APPROVED_ARTIFACT_REVISION: ""
      MODEL_ARTIFACT_REPO_ID: ""
      MODEL_ARTIFACT_DIR: "/app/artifacts"
      ALLOWED_ORIGINS: "*"
      HF_TOKEN: ""
      FIREBASE_ADMIN_CREDENTIALS: ""
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7860/health', timeout=3).getcode()==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
